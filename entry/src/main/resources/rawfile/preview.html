<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>设备预览</title>
<!--
  preview.html —— P1-5 高频预览 + 直控视图（ArkWeb 路线 A 的第二承载页）
  职责（单一）：canvas 展示 + 状态条 + 导航 FAB；逻辑在 js/（一文件一职责）：
    prevcodec.js = PREV 帧解码渲染；prevtouch.js = 直控手势注入（group_control_event）。
  数据流：GlobalChannel(PREV) → PreviewPage.ets 按设备过滤 → __pushPrev 推入渲染；
          画布手势 → previewBridge.sendPreviewEvent → GlobalChannel.sendRaw 直发。
  与 control.html 的区别：本页无信令（帧单向推入）；直控与遥控页触控协议同形。
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* canvas 分辨率由解码器按帧设置；CSS 负责等比 contain 缩放；直控手势需要 none */
  #prev-canvas { max-width: 100%; max-height: 100%; background: #000; touch-action: none; }
  #prev-status { position: absolute; left: 12px; top: 12px; padding: 4px 10px; background: rgba(0,0,0,0.55);
                 color: #7FE07F; font: 13px/1.5 sans-serif; border-radius: 6px; z-index: 10; }
  #prev-status.err { color: #FF8A8A; }
  /* 直控导航 FAB（P1-5：返回/主页/电源，对应上游虚拟导航） */
  #pv-nav { position: absolute; right: 10px; bottom: 28px; display: flex; flex-direction: column;
            gap: 10px; z-index: 10; }
  .nav-key { width: 44px; height: 44px; border-radius: 22px; background: rgba(0,0,0,0.55);
             color: #fff; font: 20px/44px sans-serif; text-align: center; cursor: pointer;
             user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="prev-canvas"></canvas></div>
<div id="prev-status">初始化</div>
<!-- 直控导航（keycode：返回4 / 主页3 / 电源26） -->
<div id="pv-nav">
  <div class="nav-key" onclick="__previewNavKey(4)">‹</div>
  <div class="nav-key" onclick="__previewNavKey(3)">○</div>
  <div class="nav-key" onclick="__previewNavKey(26)">⏻</div>
</div>
  <!-- 解码 + 直控模块（各单职责；直控出口经 previewBridge 原生代理） -->
  <script src="js/prevcodec.js"></script>
  <script src="js/prevtouch.js"></script>
</body>
</html>
